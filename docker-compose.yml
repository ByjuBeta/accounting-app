version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounting_app
      POSTGRES_USER: accounting_app
      POSTGRES_PASSWORD: accounting_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
